name: CI

on: [push]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install required packages
        run: apt-get update && apt-get install -y git sudo
      - name: Dry-run must not touch the filesystem
        run: |
          before=$(find "$HOME" -maxdepth 2 2>/dev/null | sort)
          .bin/install.sh --dry-run
          after=$(find "$HOME" -maxdepth 2 2>/dev/null | sort)
          if [ "$before" != "$after" ]; then
            echo "::error::--dry-run modified the filesystem" >&2
            echo "--- before ---"; printf '%s\n' "$before"
            echo "--- after ---";  printf '%s\n' "$after"
            exit 1
          fi
      - name: Install dotfiles
        run: .bin/install.sh
      - name: Re-run must be idempotent
        run: .bin/install.sh
      - name: Verify a known symlink resolves
        run: test -L "$HOME/.zshrc" && test -e "$HOME/.zshrc"
      - name: Uninstall must remove the symlinks it created
        run: |
          .bin/uninstall.sh
          if [ -L "$HOME/.zshrc" ]; then
            echo "::error::uninstall left a repo symlink in place" >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck .bin/install.sh .bin/uninstall.sh .bin/macos-defaults.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest dir /repo --redact -v
