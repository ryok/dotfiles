name: CI

on: [push]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install required packages
        run: apt-get update && apt-get install -y git sudo
      - name: Dry-run must not touch the filesystem
        run: |
          before=$(find "$HOME" -maxdepth 2 2>/dev/null | sort)
          .bin/install.sh --dry-run
          after=$(find "$HOME" -maxdepth 2 2>/dev/null | sort)
          if [ "$before" != "$after" ]; then
            echo "::error::--dry-run modified the filesystem" >&2
            echo "--- before ---"; printf '%s\n' "$before"
            echo "--- after ---";  printf '%s\n' "$after"
            exit 1
          fi
      - name: Install dotfiles
        run: .bin/install.sh
      - name: Re-run must be idempotent
        run: .bin/install.sh
      - name: Verify a known symlink resolves
        run: test -L "$HOME/.zshrc" && test -e "$HOME/.zshrc"
      - name: Uninstall must remove the symlinks it created
        run: |
          .bin/uninstall.sh
          if [ -L "$HOME/.zshrc" ]; then
            echo "::error::uninstall left a repo symlink in place" >&2
            exit 1
          fi

  # Homebrew の無い Linux ホスト向けの Nix 経路 (flake.nix + bootstrap.sh)。
  # Mac では Linux 向けパッケージをビルドできないので、ここが x86_64-linux での唯一の確認になる。
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the CLI toolchain
        run: nix build .#dotfiles-cli --print-build-logs
      - name: Every tool in the toolchain starts
        run: |
          for b in rtk herdr agent-browser delta git-lfs gh jq shellcheck actionlint \
                   starship zoxide fzf eza bat direnv uv rg; do
            ./result/bin/"$b" --version > /dev/null || { echo "::error::$b failed to start"; exit 1; }
          done
      - name: bootstrap.sh installs it via nix profile, and a re-run upgrades in place
        run: |
          # oh-my-zsh の導入 (ネットワーク経由) は Nix 経路の検証対象外なので飛ばす
          mkdir -p ~/.oh-my-zsh
          .bin/bootstrap.sh --no-brew --skip-browser
          .bin/bootstrap.sh --no-brew --skip-browser | tee second-run.log
          grep -q 'upgrade' second-run.log || { echo "::error::re-run did not take the upgrade path"; exit 1; }
      - name: The agent-browser skill is linked from the Nix profile
        run: test -f ~/.claude/skills/agent-browser/SKILL.md
      # install-nix-action は multi-user (daemon) 構成で入れる = p-team-17 と同じ経路。
      # 環境変数を空にした zsh で確かめることで、PATH を載せたのが .zshenv だと保証する
      # (runner の PATH には action が既に Nix を足しているため)。
      - name: .zshenv puts the Nix toolchain on PATH for a fresh shell
        run: |
          sudo apt-get install -y -qq zsh
          env -i HOME="$HOME" USER="$USER" PATH=/usr/bin:/bin zsh -c 'command -v rtk && command -v delta && command -v gh'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck .bin/*.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest dir /repo --redact -v
