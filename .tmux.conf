# マウス操作を有効化（ホイールでcopy-modeに入りやすくなる）
set -g mouse on

# スクロールバック行数（好みで増やす）
set -g history-limit 100000

# ホイールで「tmuxの出力スクロールバック」を確実に見る
#    - WheelUp: copy-mode に入ってスクロール
#    - WheelDown: copy-mode中だけスクロール（通常時はアプリに渡さない）
#
# 判定に mouse_any_flag を含めるのが要点（tmux 標準と同じ条件）。これが立って
# いるのは「アプリ自身がマウスを処理する」宣言をしている場合で、Claude Code や
# vim などの全画面アプリが該当する。この条件を落とすとホイールがアプリに届かず、
# アプリ側のスクロールまで奪ってしまう。加えて全画面アプリは代替画面(alternate
# screen)で描画され、その出力は tmux の履歴に一切積まれない（history_size=0）
# ため、copy-mode に入っても遡れるものが無い ＝ 完全に手詰まりになる。
bind-key -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  "send-keys -M" \
  "copy-mode -e \; send-keys -M"

bind-key -n WheelDownPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  "send-keys -M"

# copy-mode をvi操作に & macOSクリップボード(pbcopy)へコピー
setw -g mode-keys vi

# vで選択開始、y/Enterでpbcopyして終了
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send-keys -X cancel

# マウス選択の「離した瞬間に最下部へ戻る」問題の対策（コピーはするがcopy-modeは維持）
# ※デフォルトは MouseDragEnd1Pane が copy-pipe-and-cancel になっていて、解除で最下部へ戻りがち
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# prefix を C-a に変更（Claude Code の C-b と競合回避）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# TrueColor/RGB を tmux に明示（Ghostty + tmux 3.2+）
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# ESCの待ち時間を短くする
set -sg escape-time 10

# Shift+Enter を Claude Code に正しく渡す（Kitty keyboard protocol）
bind -n S-Enter send-keys Escape "[13;2u"

# tcmux: ウィンドウ選択に coding agent ステータスを表示
if-shell "command -v tcmux" \
  'bind-key w run-shell "tcmux lsw -A --color=always | fzf --ansi --layout reverse --tmux 80%,50% | cut -d: -f1 | xargs tmux select-window -t"'

# セッション永続化: マシン再起動でtmuxサーバーごと消えても構成を戻せるようにする
#   - resurrect: prefix C-s で保存 / prefix C-r で復元（ウィンドウ・ペイン・カレントディレクトリ）
#   - continuum: 15分ごとに自動保存し、tmuxサーバー起動時に最新の保存から自動復元
#   ※ ペイン内で動いていたプロセス（学習ジョブ等）は復元されない。長時間ジョブはログを残すこと
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM が未導入なら初回起動時に clone してプラグインを入れる（install.sh を変えずに新ホストへ展開できる）
#   install_plugins は tpm 本体が設定する TMUX_PLUGIN_MANAGER_PATH を前提にするため、先に tpm を一度実行する
if-shell "test ! -d ~/.tmux/plugins/tpm && command -v git" \
  "run-shell 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# TPM の初期化は必ず最後に置く（それより前の @plugin 宣言を読むため）
if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run-shell -b '~/.tmux/plugins/tpm/tpm'"
