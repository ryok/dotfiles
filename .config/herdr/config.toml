# herdr — AI コーディングエージェント向けのターミナル多重化ツール。
# install.sh が ~/.config/herdr/config.toml へリンクする。
#
# ここに書かない項目はすべて herdr の既定値が使われる (設定ファイル自体が任意)。
# 既定値の全量は `herdr --default-config` で確認できる。
# キーバインドやテーマなど大半の設定は `herdr server reload-config` でペインを
# 落とさずに反映できるが、起動時にしか読まれない設定は再アタッチが必要。
# 参照: https://herdr.dev/docs/configuration/

[keys]
# prefix を C-a に変更。理由は .tmux.conf と同じで、既定の C-b が
# Claude Code のキー操作と競合するため。
prefix = "ctrl+a"

[session]
# サーバ再起動後の復元時、session ref を報告する公式統合を持つエージェントの
# ペインだけが会話セッションごと復元される。対象外のペインは通常のシェルとして
# 復元される。
resume_agents_on_restore = true
